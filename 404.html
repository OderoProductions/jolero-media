<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Jolero Media</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Root-relative so this works from any missing path. If the site ever
       lives in a subfolder (like the GitHub Pages preview), the inline
       fallback below keeps it presentable even if the stylesheet 404s. -->
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: #0A0A0A; color: #fff; }
    .nf {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      padding: 24px;
    }
    .nf-code {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }
    .nf h1 {
      font-family: "Anton", "Arial Narrow", sans-serif;
      font-weight: 400;
      font-size: clamp(3rem, 12vw, 6.5rem);
      text-transform: uppercase;
      line-height: 0.98;
    }
    .nf h1 .dot { color: #FF3B30; }
    .nf p { color: rgba(255, 255, 255, 0.64); max-width: 40ch; }
    .nf a.home {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 12px 28px;
      background: #FF3B30;
      color: #0A0A0A;
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <main class="nf">
    <p class="nf-code">ERR 404 · NO SIGNAL</p>
    <h1>Lost the tape<span class="dot">.</span></h1>
    <p>This page doesn't exist — the work does.</p>
    <a class="home" href="/">Back to the site</a>
  </main>
</body>
</html>
