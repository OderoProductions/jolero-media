<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Security policy. GitHub Pages cannot send real HTTP headers, so this
       meta tag is the enforcement point. Scripts are allowed by SHA-256 hash:
       if you EDIT ANY INLINE <script> on this page you must recompute its
       hash (shasum -a 256 of the exact script contents, base64) or the
       script silently stops running. External scripts: same-origin only. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-9hUOTyB0SoibSiWOZkJw2eqQFml00iDkRip2DzmnPus=' 'sha256-JssKZq7Zz1tMpFd4T9itCjnPwy3MNAE7DIQFnyVS3Ec='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
  <meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex">
  <title>Page not found — Jolero Media</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <!-- Root-relative so this works from any missing path. If the site ever
       lives in a subfolder (like the GitHub Pages preview), the inline
       fallback below keeps it presentable even if the stylesheet 404s. -->
  <link rel="stylesheet" href="/styles.css">
  <script>/* theme before first paint: saved choice, else OS, else dark */try{var s=localStorage.getItem("jolero_theme");if(s?s==="light":matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.classList.add("theme-light")}catch(e){}</script>
  <style>
    body { background: var(--ink); color: var(--paper); }
    .nf {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      padding: 24px;
    }
    .nf-code {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--paper-40);
    }
    /* Slow signal blink — motion-gated here so it's off for reduced
       motion even if /styles.css (and its global kill switch) 404s. */
    @media (prefers-reduced-motion: no-preference) {
      .nf-code { animation: signal-blink 2.4s ease-in-out infinite alternate; }
    }
    @keyframes signal-blink {
      from { opacity: 1; }
      to { opacity: 0.35; }
    }
    .nf h1 {
      font-family: "Anton", "Arial Narrow", sans-serif;
      font-weight: 400;
      font-size: clamp(3rem, 12vw, 6.5rem);
      text-transform: uppercase;
      line-height: 0.98;
    }
    .nf h1 .dot { color: var(--accent); }
    .nf p { color: var(--paper-60); max-width: 40ch; }
    .nf a.home {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 12px 28px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
    }
  </style>
  <script src="/theme.js" defer></script>
</head>
<body>
  <main class="nf">
    <p class="nf-code">ERR 404 · NO SIGNAL</p>
    <h1>Lost the tape<span class="dot">.</span></h1>
    <p>This page doesn't exist — the work does.</p>
    <a class="home" href="/">Back to the site</a>
  </main>
</body>
</html>
