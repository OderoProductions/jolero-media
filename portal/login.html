<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Security policy. Scripts are allowed by SHA-256 hash: editing any
       inline <script> here means recomputing its hash or it stops running. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-9hUOTyB0SoibSiWOZkJw2eqQFml00iDkRip2DzmnPus='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; form-action 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
  <meta name="robots" content="noindex">

  <!-- ============================================================
       PORTAL SIGN IN

       Magic link only: no passwords are stored, sent or reset here.
       The tokens that come back land in the URL fragment and are
       consumed by auth.js, which then scrubs the address bar.
       ============================================================ -->

  <title>Sign in — Jolero Media Portal</title>
  <meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0A">

  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="portal.css">
  <script>/* theme before first paint: saved choice, else OS, else dark */try{var s=localStorage.getItem("jolero_theme");if(s?s==="light":matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.classList.add("theme-light")}catch(e){}</script>
</head>
<body>

  <header class="portal-top">
    <div class="portal-top-inner">
      <a class="wordmark" href="../" aria-label="Jolero Media — back to main site"><img class="logo-mark" src="../assets/logo.svg" alt="" width="40" height="40"><img class="logo-mark logo-mark-dark" src="../assets/logo-dark.svg" alt="" width="40" height="40"><span class="wordmark-text">JOLERO MEDIA</span></a>
      <span class="portal-tag">Client Portal</span>
      <div class="portal-top-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="portal-shell login-shell">
    <div class="panel login-panel">

      <!-- Two modes, one page. Clients get the front door; the team's way in
           is a quiet link at the bottom (?admin=1). login.js swaps the wording.

           The split is PRESENTATION ONLY. Which form someone uses does not
           decide what they can see — the role comes from the database after
           they sign in. An admin using the client form still lands in admin,
           and a client using the team form still lands on their own page. -->

      <h1 class="portal-h1" id="login-title">Client portal</h1>
      <p class="portal-sub" id="login-intro">
        Enter the email address we set your account up with. We'll send you a
        link that signs you straight in — there's no password to remember.
      </p>

      <form id="login-form" novalidate>
        <label class="field" for="login-email">
          <span id="login-label">Email address</span>
          <input type="email" id="login-email" name="email" required autocomplete="email"
                 inputmode="email" spellcheck="false" placeholder="you@yourclub.com">
        </label>
        <button class="btn btn-primary" type="submit" id="login-submit">Email me a link</button>
      </form>

      <p class="login-msg" id="login-msg" role="status" aria-live="polite" hidden></p>

      <p class="login-foot">
        Trouble getting in? Email
        <a href="mailto:info@joleromedia.com">info@joleromedia.com</a> and we'll sort it.
      </p>

      <p class="login-switch">
        <button type="button" class="link-quiet" id="to-admin">Admin login</button>
        <button type="button" class="link-quiet" id="to-client" hidden>&larr; Client sign-in</button>
      </p>

    </div>
  </main>

  <footer class="portal-foot">
    Jolero Media · West Sussex
  </footer>

  <script src="../theme.js"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
