<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=schedule.html">
  <title>Tasks have moved — Jolero Media Portal</title>
  <script>/* theme before first paint: saved choice, else OS, else dark */try{var s=localStorage.getItem("jolero_theme");if(s?s==="light":matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.classList.add("theme-light")}catch(e){}</script>
  <style>
    body { background: #0A0A0A; color: #fff; font-family: system-ui; padding: 40px; }
    a { color: #FF3B30; }
    html.theme-light body { background: #F5F5F3; color: #111114; }
    html.theme-light a { color: #D62A20; }
  </style>
</head>
<body>
  <p>Tasks now live on the <a href="schedule.html">Schedule</a> page.</p>
</body>
</html>
