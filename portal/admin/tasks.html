<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tasks — Jolero Media Portal</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../portal.css">
</head>
<body>

  <header class="portal-top">
    <div class="portal-top-inner">
      <a class="wordmark" href="../../" aria-label="Jolero Media — back to main site">JOLERO<span class="wordmark-dot" aria-hidden="true"></span>MEDIA</a>
      <nav class="admin-nav" aria-label="Admin sections">
        <a href="index.html">Dashboard</a>
        <a href="projects.html">Projects</a>
        <a href="schedule.html">Schedule</a>
        <a href="tasks.html" aria-current="page">Tasks</a>
        <a href="invoices.html">Accounting</a>
        <a href="contracts.html">Contracts</a>
        <a href="clients.html">Clients</a>
      </nav>
      <div class="portal-top-right">
        <div class="bell-wrap">
          <button class="bell-btn" id="bell-btn" type="button" aria-label="Notifications" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="bell-count" id="bell-count" hidden></span>
          </button>
          <div class="bell-panel" id="bell-panel" hidden>
            <div class="bell-panel-head">Notifications
              <button class="link-quiet" id="bell-read-all" type="button">Mark all read</button>
            </div>
            <ol class="bell-list" id="bell-list"></ol>
          </div>
        </div>
        <a href="../">Client view</a>
        <button class="link-quiet" id="reset-demo" type="button" style="font-size:0.8rem;">Reset demo</button>
      </div>
    </div>
  </header>

  <main class="portal-shell">
    <header>
      <h1 class="portal-h1">Tasks</h1>
      <p class="portal-sub">Everything that needs doing. Due dates show on the schedule too.</p>
    </header>
    <section class="portal-section" aria-labelledby="tasks-h">
      <h2 id="tasks-h">All tasks<span class="count" id="tasks-count"></span></h2>
      <div class="task-list" id="task-list"></div>
      <details class="adder">
        <summary>Add task</summary>
        <div class="adder-body">
          <form class="portal-form" id="add-task">
            <div class="field field-wide">
              <label for="nt-title">What needs doing?</label>
              <input id="nt-title" name="title" type="text" placeholder="e.g. Post matchday reel" required>
            </div>
            <div class="field">
              <label for="nt-type">Type</label>
              <select id="nt-type" name="type" required></select>
            </div>
            <div class="field">
              <label for="nt-due">Due</label>
              <input id="nt-due" name="due" type="date" required>
            </div>
            <div class="field field-wide">
              <label for="nt-project">Linked project <span class="optional">(optional)</span></label>
              <select id="nt-project" name="projectId"></select>
            </div>
            <div class="form-actions"><button class="btn btn-primary" type="submit">Add task</button></div>
          </form>
        </div>
      </details>
    </section>
  </main>

  <!-- Shared task editor (opened from the Tasks page and the calendar) -->
  <dialog class="pdialog" id="task-dialog" aria-labelledby="td-title">
    <div class="pdialog-head">
      <h3 id="td-title">Task</h3>
      <button class="pdialog-close" type="button" data-close="task-dialog" aria-label="Close">&times;</button>
    </div>
    <div class="pdialog-body">
      <form class="portal-form" id="task-form">
        <input type="hidden" name="id">
        <div class="field field-wide">
          <label for="td-name">What needs doing?</label>
          <input id="td-name" name="title" type="text" required>
        </div>
        <div class="field">
          <label for="td-type">Type</label>
          <select id="td-type" name="type"></select>
        </div>
        <div class="field">
          <label for="td-due">Due</label>
          <input id="td-due" name="due" type="date" required>
        </div>
        <div class="field field-wide">
          <label for="td-project">Linked project <span class="optional">(optional)</span></label>
          <select id="td-project" name="projectId"></select>
        </div>
        <label class="agree-row field-wide">
          <input type="checkbox" name="done"><span>Done</span>
        </label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Save task</button>
          <button class="btn btn-ghost" type="button" data-close="task-dialog">Cancel</button>
          <button class="btn btn-ghost" type="button" id="td-delete">Delete</button>
        </div>
      </form>
    </div>
  </dialog>

  <footer class="portal-foot">Jolero Media · internal — Phase 1/4 preview running on mock data</footer>

  <script src="../data.js"></script>
  <script src="../store.js"></script>
  <script src="../admin.js"></script>
</body>
</html>
