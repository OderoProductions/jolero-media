<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard — Jolero Media Portal</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../portal.css">
  <script>/* apply saved theme before first paint */try{if(localStorage.getItem('jolero_theme')==='light')document.documentElement.classList.add('theme-light')}catch(e){}</script>
</head>
<body>

  <header class="portal-top">
    <div class="portal-top-inner">
      <a class="wordmark" href="../../" aria-label="Jolero Media — back to main site">JOLERO<span class="wordmark-dot" aria-hidden="true"></span>MEDIA</a>
      <nav class="admin-nav" aria-label="Admin sections">
        <a href="index.html" aria-current="page">Dashboard</a>
        <a href="projects.html">Projects</a>
        <a href="schedule.html">Schedule</a>
        <a href="invoices.html">Accounting</a>
        <a href="contracts.html">Contracts</a>
        <a href="clients.html">Clients</a>
      </nav>
      <div class="portal-top-right">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="bell-wrap">
          <button class="bell-btn" id="bell-btn" type="button" aria-label="Notifications" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="bell-count" id="bell-count" hidden></span>
          </button>
          <div class="bell-panel" id="bell-panel" hidden>
            <div class="bell-panel-head">Notifications
              <button class="link-quiet" id="bell-read-all" type="button">Mark all read</button>
            </div>
            <ol class="bell-list" id="bell-list"></ol>
          </div>
        </div>
        <a href="../">Client view</a>
        <button class="link-quiet" id="reset-demo" type="button" style="font-size:0.8rem;">Reset demo</button>
      </div>
    </div>
  </header>

  <main class="portal-shell">
    <header>
      <h1 class="portal-h1">Dashboard</h1>
      <p class="portal-sub">Everything at a glance. Tap any card to go deeper.</p>
    </header>
    <section class="portal-section" aria-label="Overview">
      <div class="dash-grid" id="dash-grid"></div>
    </section>
  </main>

  <footer class="portal-foot">Jolero Media · internal — Phase 1/4 preview running on mock data</footer>

  <script src="../data.js"></script>
  <script src="../store.js"></script>
  <script src="../admin.js"></script>
</body>
</html>
